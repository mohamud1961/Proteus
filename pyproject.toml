[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proteus-agent-compiler"
version = "0.1.0"
description = "Proteus public harness: task-conditioned runtime, runner, eval substrate, and independent verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml", "httpx", "openai"]
live = ["litellm", "openai"]
vision = ["pymupdf", "rapidocr-onnxruntime"]
full = ["litellm", "pymupdf", "pyyaml", "rapidocr-onnxruntime", "httpx", "openai"]

[project.scripts]
proteus = "proteus.cli:main"

[tool.setuptools.packages.find]
include = ["proteus*", "older_variants*", "runner*", "eval_suite*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
