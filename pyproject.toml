[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proteus-agent-compiler"
version = "0.1.0"
description = "A replayable task-conditioned agent compiler with independent verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
proteus = "proteus.cli:main"

[tool.setuptools.packages.find]
include = ["proteus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
