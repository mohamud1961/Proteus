$schema: https://json-schema.org/draft/2020-12/schema
$id: final_harness_eval_suite/family_winner_registry.schema.yaml
title: Final Harness Family Winner Registry
type: object
additionalProperties: false
required:
  - schema_version
  - board_id
  - winners
properties:
  schema_version:
    type: string
    const: final_harness_family_winner_registry.v1
  board_id:
    type: string
    const: final_harness_eval_suite_v1
  generated_at:
    type: string
  winners:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - family_id
        - winner_id
        - mechanism_id
        - variant_or_route_id
        - touched_code_surfaces
        - claimed_changed_surfaces
        - family_board_evidence_refs
        - result_row_refs
        - scoreboard_refs
        - sentinel_refs
        - global_board_check_ref
        - compatibility_check_refs
        - carry_forward_status
        - authority_label
        - promotion_scope
        - contamination_status
        - invalidity_status
        - cost_step_delta_vs_control
        - known_risks
        - known_interactions
        - excluded_recipe_ids
        - eligible_recipe_ids
        - review_gate_status
      properties:
        family_id:
          type: string
          minLength: 1
        winner_id:
          type: string
          minLength: 1
        mechanism_id:
          type: string
          minLength: 1
        variant_or_route_id:
          type: string
          minLength: 1
        touched_code_surfaces:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        claimed_changed_surfaces:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        family_board_evidence_refs:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        result_row_refs:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        scoreboard_refs:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        sentinel_refs:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        global_board_check_ref:
          type: string
          minLength: 1
        compatibility_check_refs:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        carry_forward_status:
          type: string
          enum:
            - ineligible_no_family_winner
            - lane_local_candidate
            - lane_local_winner
            - carry_forward_candidate
            - recipe_ingredient
            - excluded_incompatible
            - retired_or_killed
        authority_label:
          type: string
          enum:
            - debug
            - equivalent
            - native
            - certified
        promotion_scope:
          type: string
          enum:
            - none
            - lane_local_only
            - global_promoted
        contamination_status:
          type: string
          enum:
            - clean
            - suspect
            - contaminated
            - unknown
        invalidity_status:
          type: string
          enum:
            - valid
            - invalid
            - invalid_unclassified
        cost_step_delta_vs_control:
          type: object
          additionalProperties: false
          required:
            - cost_delta_pct
            - step_delta_pct
          properties:
            cost_delta_pct:
              type: number
            step_delta_pct:
              type: number
        known_risks:
          type: array
          items:
            type: string
            minLength: 1
        known_interactions:
          type: array
          items:
            type: string
            minLength: 1
        excluded_recipe_ids:
          type: array
          items:
            type: string
            minLength: 1
        eligible_recipe_ids:
          type: array
          items:
            type: string
            minLength: 1
        review_gate_status:
          type: string
          enum:
            - not_started
            - pending
            - passed
            - failed
